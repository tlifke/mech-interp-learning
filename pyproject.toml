[project]
name = "visualizer"
version = "0.1.0"
description = "Mech interp visualizers, built module-by-module alongside the curriculum."
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformer-lens>=2.0",
    "plotly>=5.20",
    "scikit-learn>=1.4",
    "numpy>=1.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visualizer"]
